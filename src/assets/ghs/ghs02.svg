<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GHS02 Flamme">
  <defs>
    <linearGradient id="g02frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b3b"/>
      <stop offset="1" stop-color="#c81a1a"/>
    </linearGradient>
    <linearGradient id="g02flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#111"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
  </defs>
  <polygon points="50,2 98,50 50,98 2,50" fill="#fff" stroke="url(#g02frame)" stroke-width="6" stroke-linejoin="round"/>
  <!-- ground line -->
  <rect x="20" y="84" width="60" height="3" fill="#000"/>
  <!-- main flame outline -->
  <path d="M50 14
           C 56 26, 70 32, 70 48
           C 70 58, 62 64, 60 60
           C 64 54, 60 48, 56 50
           C 60 56, 54 64, 50 64
           C 46 64, 40 56, 44 50
           C 40 48, 36 54, 40 60
           C 38 64, 30 58, 30 48
           C 30 32, 44 26, 50 14 Z"
        fill="url(#g02flame)"/>
  <!-- inner flame highlight -->
  <path d="M50 28
           C 54 36, 62 42, 60 52
           C 58 58, 52 60, 52 56
           C 54 52, 52 48, 50 48
           C 48 48, 46 52, 48 56
           C 48 60, 42 58, 40 52
           C 38 42, 46 36, 50 28 Z"
        fill="#fff" opacity="0.12"/>
  <!-- secondary flame -->
  <path d="M68 70 C 74 72, 76 78, 72 82 C 70 78, 66 76, 68 70 Z" fill="url(#g02flame)"/>
  <path d="M32 72 C 26 74, 24 80, 28 82 C 30 78, 34 76, 32 72 Z" fill="url(#g02flame)"/>
