<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GHS04 Gasflasche">
  <defs>
    <linearGradient id="g04frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b3b"/>
      <stop offset="1" stop-color="#c81a1a"/>
    </linearGradient>
    <linearGradient id="g04cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.4" stop-color="#000"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>
  <polygon points="50,2 98,50 50,98 2,50" fill="#fff" stroke="url(#g04frame)" stroke-width="6" stroke-linejoin="round"/>
  <g transform="rotate(-22 50 55)">
    <!-- valve -->
    <rect x="46" y="14" width="8" height="6" fill="#000"/>
    <rect x="44" y="20" width="12" height="4" fill="#000"/>
    <!-- neck -->
    <rect x="47" y="24" width="6" height="6" fill="#000"/>
    <!-- shoulder -->
    <path d="M38 36 Q 50 28 62 36 L 62 40 L 38 40 Z" fill="url(#g04cyl)"/>
    <!-- body -->
    <rect x="38" y="38" width="24" height="46" fill="url(#g04cyl)"/>
    <!-- base -->
    <rect x="36" y="82" width="28" height="4" fill="#000"/>
    <rect x="34" y="84" width="32" height="3" fill="#000"/>
    <!-- highlight -->
    <rect x="41" y="40" width="3" height="42" fill="#fff" opacity="0.18"/>
    <!-- label band -->
    <rect x="38" y="58" width="24" height="2" fill="#fff" opacity="0.35"/>
    <rect x="38" y="64" width="24" height="2" fill="#fff" opacity="0.35"/>
  </g>
</svg>
