      <stop offset="0" stop-color="#ef3b3b"/>
      <stop offset="1" stop-color="#c81a1a"/>
    </linearGradient>
    <linearGradient id="g03flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
