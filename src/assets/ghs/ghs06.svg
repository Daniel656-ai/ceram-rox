<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GHS06 Totenkopf mit gekreuzten Knochen">
  <defs>
    <linearGradient id="g06frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b3b"/>
      <stop offset="1" stop-color="#c81a1a"/>
    </linearGradient>
    <radialGradient id="g06skull" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.6" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>
  <polygon points="50,2 98,50 50,98 2,50" fill="#fff" stroke="url(#g06frame)" stroke-width="6" stroke-linejoin="round"/>

  <!-- crossed bones -->
  <g fill="#000">
    <g transform="rotate(45 50 60)">
      <rect x="18" y="56" width="64" height="8" rx="4"/>
      <circle cx="18" cy="56" r="5"/><circle cx="18" cy="64" r="5"/>
      <circle cx="82" cy="56" r="5"/><circle cx="82" cy="64" r="5"/>
    </g>
    <g transform="rotate(-45 50 60)">
      <rect x="18" y="56" width="64" height="8" rx="4"/>
      <circle cx="18" cy="56" r="5"/><circle cx="18" cy="64" r="5"/>
      <circle cx="82" cy="56" r="5"/><circle cx="82" cy="64" r="5"/>
    </g>
  </g>

  <!-- skull -->
  <path d="M30 38
           C 30 22, 70 22, 70 38
           L 70 54
           C 70 58, 66 60, 62 60
           L 60 66
           L 56 66
           L 54 62
           L 46 62
           L 44 66
           L 40 66
           L 38 60
           C 34 60, 30 58, 30 54 Z"
        fill="url(#g06skull)"/>
  <!-- eye sockets -->
  <ellipse cx="40" cy="42" rx="6" ry="7" fill="#fff"/>
  <ellipse cx="60" cy="42" rx="6" ry="7" fill="#fff"/>
  <!-- nasal -->
  <path d="M48 50 L 50 56 L 52 50 Z" fill="#fff"/>
  <!-- teeth gap -->
  <rect x="42" y="58" width="2" height="4" fill="#fff"/>
  <rect x="48" y="58" width="2" height="4" fill="#fff"/>
  <rect x="54" y="58" width="2" height="4" fill="#fff"/>
</svg>
