<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GHS01 Explodierende Bombe">
  <defs>
    <linearGradient id="g01frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b3b"/>
      <stop offset="1" stop-color="#c81a1a"/>
    </linearGradient>
    <radialGradient id="g01bomb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.55" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>
  <polygon points="50,2 98,50 50,98 2,50" fill="#fff" stroke="url(#g01frame)" stroke-width="6" stroke-linejoin="round"/>
  <g>
    <!-- shockwave shards -->
    <g fill="#000">
      <polygon points="50,18 54,30 58,20 56,32 64,25 60,34 70,32 62,38 73,42 63,42 72,49 62,46 68,55 60,50 62,60 56,52"/>
      <polygon points="50,18 46,30 42,20 44,32 36,25 40,34 30,32 38,38 27,42 37,42 28,49 38,46 32,55 40,50 38,60 44,52"/>
      <circle cx="80" cy="20" r="2"/>
      <circle cx="18" cy="22" r="1.5"/>
      <circle cx="84" cy="40" r="1.5"/>
      <circle cx="14" cy="44" r="2"/>
      <circle cx="78" cy="62" r="1.2"/>
      <circle cx="20" cy="64" r="1.2"/>
    </g>
    <!-- bomb sphere -->
    <circle cx="50" cy="62" r="18" fill="url(#g01bomb)"/>
    <ellipse cx="44" cy="55" rx="5" ry="3" fill="#fff" opacity="0.18"/>
    <!-- fuse -->
    <path d="M50 44 C 56 40, 60 36, 62 30" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- spark -->
    <g fill="#000">
      <polygon points="62,30 65,24 67,28 71,25 69,31 74,32 68,34 71,38 66,35 64,40 62,34 58,36"/>
    </g>
  </g>
</svg>
