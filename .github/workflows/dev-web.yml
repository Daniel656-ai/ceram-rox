name: Build Dev Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-web
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Check repository variables
        env:
          DEV_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          DEV_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [ -z "$DEV_SUPABASE_URL" ]; then
            echo "::error::Repository-Variable DEV_SUPABASE_URL fehlt (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          if [ -z "$DEV_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository-Variable DEV_SUPABASE_PUBLISHABLE_KEY fehlt (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          exit $missing

      - name: Build (development mode)
        env:
          VITE_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ceram-rox-dev
          # PDF-Analysedienst (parse-production-release) laeuft sonst auf dem Cloud-Fallback
          VITE_IMPORT_SERVICE_URL: ${{ vars.DEV_SUPABASE_URL }}
          VITE_IMPORT_SERVICE_ANON_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:dev

      - name: Safety check (no production or cloud Supabase URL in build)
        env:
          DEV_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
        run: |
          CLOUD_REF='vrzqlfovvdxofxqyslev'
          # Der ungenutzte Rueckfallwert FALLBACK_URL (src/lib/api/backendConfig.ts)
          # bleibt im Bundle und ist erlaubt; jede andere Cloud-Referenz ist es nicht.
          FALLBACK_URL_LITERAL="\"https://${CLOUD_REF}.supabase.co\""

          if grep -rEl '172\.30\.100\.162:54321' dist; then
            echo "::error::Build enthaelt die Produktions-URL (172.30.100.162:54321). Abbruch."
            exit 1
          fi

          total=$(grep -rFo "$CLOUD_REF" dist | wc -l)
          allowed=$(grep -rFo "$FALLBACK_URL_LITERAL" dist | wc -l)
          echo "Cloud-Ref im Build: $total Treffer, davon $allowed als erlaubter FALLBACK_URL."
          if [ "$total" -ne "$allowed" ]; then
            echo "::error::Cloud-Ref ${CLOUD_REF} kommt ausserhalb von FALLBACK_URL im Build vor. Abbruch."
            grep -rFl "$CLOUD_REF" dist
            exit 1
          fi

          if ! grep -rFq "$DEV_SUPABASE_URL" dist; then
            echo "::error::Dev-URL ${DEV_SUPABASE_URL} steht nicht im Build. Abbruch."
            exit 1
          fi
          echo "OK: keine Produktions-/Cloud-URL ausser FALLBACK_URL, Dev-URL vorhanden."

      - name: Write build-info.json
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("dist/build-info.json", JSON.stringify({
              sha: process.env.COMMIT_SHA,
              message: process.env.COMMIT_MESSAGE || "(manueller Lauf)",
              builtAt: new Date().toISOString(),
            }, null, 2));
          '

      - name: Publish to dev-web branch
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd dist
          git init -q
          git checkout -q --orphan dev-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dev web build from ${COMMIT_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin dev-web
