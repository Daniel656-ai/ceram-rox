name: Build & Release
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --force
      - name: Create .env.production
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.production
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env.production
      - name: Determine next version (no commit)
        shell: bash
        run: |
          # Höchste Version aus allen Release-Tags (vX.Y.Z) und tauri.conf.json, numerisch (semver) verglichen
          tag=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          base=$(printf '%s\n%s\n' "${tag:-0.0.0}" "$conf" | sort -V | tail -1)
          major=$(echo $base | cut -d. -f1)
          minor=$(echo $base | cut -d. -f2)
          patch=$(echo $base | cut -d. -f3)
          new="$major.$minor.$((patch + 1))"
          echo "Letzter Tag: ${tag:-keiner}, tauri.conf.json: $conf, neue Version: $new"
          # Nur im Build-Arbeitsverzeichnis setzen, nicht committen
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$new\"/" src-tauri/tauri.conf.json
          echo "NEW_VERSION=$new" >> $GITHUB_ENV
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: npx tauri
          tagName: v${{ env.NEW_VERSION }}
          releaseName: "Ceram Rox v${{ env.NEW_VERSION }}"
          releaseBody: "Neue Version verfügbar"
          releaseDraft: false
          prerelease: false
