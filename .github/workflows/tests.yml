name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # gleiche Node-Version wie dev-web.yml
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test
